<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round Table</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e0da; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .spacer { flex:1; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:820px; padding:10px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); border-left-width:5px; white-space:pre-wrap; word-wrap:break-word; }
  .msg .who { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:2px; }
  .msg.user { align-self:flex-end; background:#eceae4; }
  .msg.system { color:#9a2b2b; border-left-color:#9a2b2b; font-size:13px; }
  #typing { padding:0 16px 6px; color:var(--muted); font-size:13px; min-height:22px; }
  #manual { display:none; background:#fff8e1; border-top:1px solid #f0d98a; padding:10px 16px; }
  #manual textarea { width:100%; height:70px; margin:6px 0; font:13px monospace; }
  footer { padding:10px 16px; background:var(--card); border-top:1px solid var(--line); display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  #input { flex:1; min-width:240px; height:60px; resize:vertical; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; }
  button, select { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  #rounds { max-width:100%; }
  button.primary { background:#1d1d1b; color:#fff; border-color:#1d1d1b; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { font-size:12px; color:var(--muted); width:100%; }
</style>
</head>
<body>
<header>
  <h1>Round Table</h1>
  <span id="agents"></span>
  <span class="spacer"></span>
  <span id="mockbadge" style="display:none;color:#9a6b00">MOCK MODE</span>
  <span id="version" style="font-size:12px;color:var(--muted)" aria-label="App version"></span>
  <button id="clear">Clear</button>
</header>
<div id="log"></div>
<div id="typing"></div>
<div id="manual">
  <b id="mname"></b> has no CLI. Copy the prompt, paste it into that chat, then paste the reply back here.
  <textarea id="mprompt" readonly></textarea>
  <button id="mcopy">Copy prompt</button>
  <textarea id="mreply" placeholder="Paste the reply here"></textarea>
  <button class="primary" id="msubmit">Send reply to room</button>
  <button id="mskip">Skip</button>
</div>
<footer>
  <textarea id="input" placeholder="Ask the room. Type @Name (like @Claude) to ask specific models. Enter sends, Shift+Enter for a new line."></textarea>
  <label>How many turns?
    <select id="rounds"><option value="1" selected>Everyone answers once</option><option value="2">Answer, then react to each other</option><option value="3">Answer, react, then react again</option></select>
  </label>
  <button class="primary" id="send">Send</button>
  <button id="stop" disabled>Stop</button>
  <div class="hint">Everyone answers your question at the same time. With more turns, each model then reads what the others said and replies.</div>
</footer>
<script>
const PALETTE = ['#2f6fdd','#c2570c','#2a8a5b','#8a3fb5','#b5365a','#4a7c8c'];
const colors = {};
let agents = [], pending = [];
const $ = id => document.getElementById(id);

function colorOf(name) { return colors[name] || '#999'; }

function addMessage(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + m.role;
  if (m.role === 'agent') d.style.borderLeftColor = colorOf(m.author);
  const w = document.createElement('div'); w.className = 'who'; w.textContent = m.author;
  const t = document.createElement('div'); t.textContent = m.text;
  d.append(w, t);
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

function setBusy(b) { $('send').disabled = b; $('stop').disabled = !b; }

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) alert(j.error || 'Request failed');
  return j;
}

function showManual() {
  const p = pending[0];
  $('manual').style.display = p ? 'block' : 'none';
  if (p) { $('mname').textContent = p.name; $('mprompt').value = p.prompt; $('mreply').value = ''; }
}

async function init() {
  const s = await (await fetch('/api/state')).json();
  agents = s.agents;
  agents.forEach((a, i) => (colors[a.name] = PALETTE[i % PALETTE.length]));
  $('version').textContent = `v${s.version} · updated ${s.updated}`;
  $('mockbadge').style.display = s.mock ? 'inline' : 'none';
  $('agents').innerHTML = '';
  agents.forEach(a => {
    const l = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; cb.value = a.name;
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = colorOf(a.name);
    l.append(cb, dot, document.createTextNode(a.name + (a.type === 'manual' ? ' (paste)' : '')));
    $('agents').appendChild(l);
  });
  s.messages.forEach(addMessage);
  setBusy(s.busy);

  const es = new EventSource('/events');
  const typing = new Set();
  es.onmessage = e => {
    const evt = JSON.parse(e.data);
    if (evt.type === 'message') addMessage(evt.message);
    if (evt.type === 'typing') { evt.on ? typing.add(evt.name) : typing.delete(evt.name); $('typing').textContent = typing.size ? [...typing].join(', ') + ' thinking...' : ''; }
    if (evt.type === 'manual') { pending.push(evt); showManual(); }
    if (evt.type === 'idle') { setBusy(false); pending = []; showManual(); }
    if (evt.type === 'cleared') $('log').innerHTML = '';
  };
}

$('send').onclick = async () => {
  const text = $('input').value.trim();
  if (!text) return;
  const names = [...document.querySelectorAll('#agents input:checked')].map(c => c.value);
  setBusy(true);
  const r = await post('/api/ask', { text, agents: names, rounds: Number($('rounds').value) });
  if (r.ok) $('input').value = ''; else setBusy(false);
};
$('input').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  if (e.shiftKey && !(e.metaKey || e.ctrlKey)) return; // Shift+Enter: newline
  e.preventDefault();
  if (!$('send').disabled) $('send').click();
});
$('stop').onclick = () => post('/api/stop');
$('clear').onclick = () => confirm('Clear the whole transcript?') && post('/api/clear');
$('mcopy').onclick = () => navigator.clipboard.writeText($('mprompt').value);
$('msubmit').onclick = async () => { const p = pending.shift(); showManual(); await post('/api/manual', { id: p.id, text: $('mreply').value }); };
$('mskip').onclick = async () => { const p = pending.shift(); showManual(); await post('/api/manual', { id: p.id, text: '' }); };
init();
</script>
</body>
</html>
